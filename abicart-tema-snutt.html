<script>
/* Valley Dogs – skickar butikens sessionstoken till designverktyget.
   Klistras in i Abicart: Utseende → Teman → redigera → "Eget innehåll i head".
   Länka till verktyget med t.ex.:
     <a href="https://design.valleydogs.se/">Designa ditt halsband</a>
   Alla länkar till design.valleydogs.se hanteras automatiskt. */
(function () {
  var VERKTYG = 'https://design.valleydogs.se/';
  var WEBSHOP = 119951;
  function isDesignLink(a) {
    return a && a.href && a.href.indexOf('design.valleydogs.se') !== -1;
  }
  function getToken() {
    return fetch('/backend/jsonrpc/v1?webshop=' + WEBSHOP + '&language=sv', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'Session.getToken', params: [] })
    }).then(function (r) { return r.json(); })
      .then(function (j) { return (j && j.result) ? String(j.result) : null; })
      .catch(function () { return null; });
  }
  document.addEventListener('click', function (e) {
    var a = e.target.closest ? e.target.closest('a') : null;
    if (!isDesignLink(a)) return;
    e.preventDefault();
    var base = a.href.split('#')[0] || VERKTYG;
    getToken().then(function (token) {
      window.location.href = base + (token ? '#s=' + token : '');
    });
  }, true);
})();
</script>
