<script>
/* Valley Dogs varukorgssnutt. Enda snutt som ska ligga i temats head.
   Designverktyget resolvar designen mot artikelns riktiga val och skickar
   FÄRDIGA val-uid:n som #vdadd=... Denna snutt gör bara: hämta/skapa
   sessionens korg och lagg halsbandet i den, gå sen till startsidan.
   Lanka till verktyget med en vanlig lank till design.valleydogs.se */
(function () {
  var WEBSHOP = 119951;
  var m = location.hash.match(/[#&]vdadd=([A-Za-z0-9\-_]+)/);
  if (!m) return;

  function rpc(method, params) {
    return fetch('/backend/jsonrpc/v1?webshop=' + WEBSHOP + '&language=sv&vat_country=SE', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: method, params: params })
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (j.error) throw new Error(j.error.message || 'API-fel');
      return j.result;
    });
  }
  function b64decode(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    var bin = atob(s), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  var data;
  try { data = JSON.parse(b64decode(m[1])); } catch (e) { return; }
  var articleUid = data.a, params = data.p || {};

  // rensa hashen direkt så en omladdning inte lägger i dubbelt
  history.replaceState(null, '', location.pathname + location.search);

  // Hämta sessionens korg-order. Session.get({order:true}) ger den befintliga
  // korgen, men för en HELT TOM session (ny kund) returnerar den {order:null}.
  // Då skapas en order OCH länkas till sessionen med Session.set – annars blir
  // det en orphan-order som addArticle lägger i utan fel men som aldrig syns i
  // korgen. (Session.set kan svara "Validation error" men länkningen sker ändå;
  // vi läser tillbaka den med Session.get.)
  function sessionOrderUid() {
    return rpc('Session.get', [{ order: true }]).then(function (s) {
      if (s && s.order) return s.order;
      return rpc('Order.set', [null, {
        language: 'sv', currency: 'SEK', customer: { address: { country: 'SE' } }
      }, { uid: true }]).then(function (created) {
        var uid = created && created.uid;
        return rpc('Session.set', [{ order: uid }]).catch(function () {})
          .then(function () {
            return rpc('Session.get', [{ order: true }]).then(function (s2) {
              return (s2 && s2.order) || uid;
            });
          });
      });
    });
  }

  sessionOrderUid().then(function (orderUid) {
    var p = { quantity: 1 };
    for (var k in params) if (params.hasOwnProperty(k)) p[k] = params[k];
    return rpc('Order.addArticle', [orderUid, articleUid, p, { uid: true }, { fastVerify: true }]);
  }).then(function () {
    location.href = '/';   // startsidan visar varukorgen
  }).catch(function (err) {
    alert('Kunde inte lägga halsbandet i varukorgen: ' + (err && err.message) +
      '. Prova igen, eller mejla oss så hjälper vi till.');
    location.href = '/';
  });
})();
</script>
