<script>
/* Valley Dogs varukorgssnutt. ENDA snutt som ska ligga i temats head – lägg
   bara in den EN gång (inte dubbelt). Designverktyget resolvar designen mot
   artikelns riktiga val och skickar FÄRDIGA val-uid:n som #vdadd=... Denna snutt
   lägger halsbandet i sessionens korg och går sen till startsidan. Länka till
   verktyget med en vanlig länk till design.valleydogs.se

   VIKTIGT om sessionen: API-anropen måste köras i KUNDENS korg-session, annars
   svarar Order.addArticle "Object not found". Sessionens token hämtas från
   butikens eget ramverk (twsReduxStore.getState().session) – samma token som
   "Köp"-knappen använder – och skickas som ?session=... i varje anrop. Vi väntar
   tills ramverket hunnit etablera sessionen innan vi kör, så det fungerar även
   för en helt ny kund (tom session). Kakan twssessid_<webshop> används som
   reserv. (Det gamla sättet, Session.set {order}, fungerar inte längre – Abicart
   har gjort fältet skrivskyddat.) */
(function () {
  var WEBSHOP = 119951;
  var m = location.hash.match(/[#&]vdadd=([A-Za-z0-9\-_]+)/);
  if (!m) return;

  function b64decode(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    var bin = atob(s), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  var data;
  try { data = JSON.parse(b64decode(m[1])); } catch (e) { return; }
  var articleUid = data.a, params = data.p || {};
  if (!articleUid) return;

  // rensa hashen direkt så en omladdning inte lägger i dubbelt
  history.replaceState(null, '', location.pathname + location.search);

  // Sessionstoken: i första hand ur butikens state, annars ur kakan.
  function token() {
    try { var s = window.twsReduxStore && window.twsReduxStore.getState().session; if (s) return s; } catch (e) {}
    var c = document.cookie.match(new RegExp('(?:^|;\\s*)twssessid_' + WEBSHOP + '=([A-Za-z0-9]+)'));
    return c ? c[1] : '';
  }
  function storeReady() {
    try { return !!(window.twsReduxStore && window.twsReduxStore.getState().webshop); } catch (e) { return false; }
  }

  function rpc(method, params) {
    var url = '/backend/jsonrpc/v1?webshop=' + WEBSHOP + '&language=sv&vat_country=SE';
    var tok = token();
    if (tok) url += '&session=' + tok;
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: method, params: params })
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (j.error) throw new Error(j.error.message || 'API-fel');
      return j.result;
    });
  }

  function addToCart() {
    // Hämta sessionens korg-order; för en tom session skapar vi en ny (den knyts
    // till sessionen via tokenen). Lägg sen i halsbandet.
    return rpc('Session.get', [{ order: true }]).then(function (s) {
      if (s && s.order) return s.order;
      return rpc('Order.set', [null, {
        language: 'sv', currency: 'SEK', customer: { address: { country: 'SE' } }
      }, { uid: true }]).then(function (created) { return created && created.uid; });
    }).then(function (orderUid) {
      var p = { quantity: 1 };
      for (var k in params) if (params.hasOwnProperty(k)) p[k] = params[k];
      return rpc('Order.addArticle', [orderUid, articleUid, p, { uid: true }, { fastVerify: true }]);
    });
  }

  function go() {
    addToCart().then(function () {
      location.href = '/';   // startsidan visar varukorgen
    }).catch(function (err) {
      alert('Kunde inte lägga halsbandet i varukorgen: ' + (err && err.message) +
        '. Prova igen, eller mejla oss så hjälper vi till.');
      location.href = '/';
    });
  }

  // Vänta tills butiken etablerat sessionen (store redo + token finns), kör sen.
  // Efter ~20 s körs det ändå (kakan kan räcka).
  var tries = 0;
  (function run() {
    if (storeReady() && token()) return go();
    if (++tries > 200) return go();
    setTimeout(run, 100);
  })();
})();
</script>
